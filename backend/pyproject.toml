[project]
name = "feedcatch"
version = "0.1.0"
description = "Self-hosted anime RSS -> qBittorrent automation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "feedparser>=6.0,<7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "bcrypt>=4.1,<6",
    "cryptography>=42",
    "itsdangerous>=2.2,<3",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "respx>=0.21,<1",
    "ruff>=0.6",
    "mypy>=1.10,<2",
    "freezegun>=1.5,<2",
    "httpx>=0.27,<1",
    "types-python-dateutil",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
